---

# Managed by fd1x/infrastructure-github.
# Manual edits will be overwritten on the next `terraform apply`.
#
# Action pins live in its `locals.tf`. Never merge a Dependabot pull request
# against this file; bump the pin there instead.

name: Hugo Deploy

on:
  workflow_call:
    inputs:
      project-name:
        description: 'Cloudflare Pages project name'
        type: string
        required: true
      base-url:
        description: >-
          Base URL to build the site with, for a copy served from another
          hostname. Empty builds with the baseURL in the site's own config.
        type: string
        required: false
        default: ''
      noindex:
        description: >-
          Serve every path with `X-Robots-Tag: noindex`, for a copy that search
          engines must not index.
        type: boolean
        required: false
        default: false
    secrets:
      CLOUDFLARE_PAGES_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      # Sites that read CAPSTONE at build time (terminology-website) pass these;
      # every other site leaves them unset and never reads them.
      CAPSTONE_GRAPHQL_TOKEN:
        required: false
      CAPSTONE_CF_ACCESS_CLIENT_ID:
        required: false
      CAPSTONE_CF_ACCESS_CLIENT_SECRET:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      deployments: write
    steps:
      # see: https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0

      # see: https://github.com/peaceiris/actions-hugo/releases/tag/v3.2.1
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78  # v3.2.1
        with:
          hugo-version: '0.164.0'
          extended: true

      - name: Build
        env:
          CAPSTONE_GRAPHQL_TOKEN: ${{ secrets.CAPSTONE_GRAPHQL_TOKEN }}
          CAPSTONE_CF_ACCESS_CLIENT_ID: ${{ secrets.CAPSTONE_CF_ACCESS_CLIENT_ID }}
          CAPSTONE_CF_ACCESS_CLIENT_SECRET: ${{ secrets.CAPSTONE_CF_ACCESS_CLIENT_SECRET }}
          BASE_URL: ${{ inputs.base-url }}
        # HUGO_BASEURL is exported only when the caller passes one, so an empty
        # value can never stand in for the baseURL in the site's own config.
        run: |
          if [ -n "${BASE_URL}" ]; then
            export HUGO_BASEURL="${BASE_URL}"
          fi
          hugo

      # Cloudflare Pages reads `_headers` from the root of the deployed
      # directory. No site ships one; a site that starts to must merge the two.
      - name: Write noindex headers
        if: inputs.noindex
        run: |
          if [ -e public/_headers ]; then
            echo "::error::public/_headers already exists; refusing to overwrite it with the noindex rule." >&2
            exit 1
          fi
          printf '/*\n  X-Robots-Tag: noindex\n' > public/_headers

      # wrangler-action spawns `command` directly (no shell), so the branch name
      # cannot inject; this guard pins the charset rather than trusting that.
      - name: Validate deploy branch name
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if ! printf '%s' "${BRANCH}" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "Refusing to deploy: unsafe characters in branch name: ${BRANCH}" >&2
            exit 1
          fi

      # see: https://github.com/cloudflare/wrangler-action/releases/tag/v4.0.0
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0  # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy public --project-name="${{ inputs.project-name }}" --branch="${{ github.head_ref || github.ref_name }}"
